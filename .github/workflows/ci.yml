# =============================================================================
# VIDAL PRO PORTFOLIO — CI
# Quality (lint + types), production build, end-to-end tests and dependency audit.
# =============================================================================

name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint & Type Check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck

  build-and-test:
    name: Build & E2E
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: test-results/
          retention-days: 14

  security:
    name: Dependency Audit (production)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run audit

  enterprise-evidence:
    name: Enterprise visual + a11y + SEO + links
    # Every pull request into main and every push to main (previously pinned to four retired branch names).
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      # Each lab check below is decoupled (continue-on-error + id): one failing step can no longer skip the others.
      # The final gate step fails the job if any of the required checks did not succeed.
      - name: Capture responsive screenshots and interaction evidence
        id: visual
        continue-on-error: true
        env:
          ENTERPRISE_VISUAL_EVIDENCE: "1"
          PLAYWRIGHT_HTML_OUTPUT_DIR: audit-results/playwright-report
        run: npx playwright test tests/e2e/enterprise-visual-audit.spec.ts --reporter=html,line --workers=1
      - name: Fetch pinned axe browser bundle without touching dependencies
        run: |
          mkdir -p audit-tools
          npm pack axe-core@4.10.3 --pack-destination audit-tools --silent
          tar -xzf audit-tools/axe-core-4.10.3.tgz -C audit-tools
      - name: Start isolated production build for lab checks
        run: |
          npm run start -- --port 3102 > /tmp/ve-qa-next.log 2>&1 &
          echo $! > /tmp/ve-qa-next.pid
          for attempt in $(seq 1 50); do
            if curl -fsS http://localhost:3102/en > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/ve-qa-next.log
          exit 1
      - name: Run pinned axe-core audit (all locales, desktop and mobile)
        id: axe
        continue-on-error: true
        run: node scripts/audit-accessibility.mjs
      - name: Run Lighthouse on mobile ES and desktop DE
        id: lighthouse
        continue-on-error: true
        run: |
          mkdir -p audit-results
          CHROME_PATH="$(find "$HOME/.cache/ms-playwright" -type f \( -path '*/chrome-linux/chrome' -o -path '*/chrome-linux64/chrome' \) -print -quit)"
          if [ -z "$CHROME_PATH" ]; then echo "No Chromium executable available"; exit 1; fi
          export CHROME_PATH
          ./node_modules/.bin/lighthouse http://localhost:3102/es --quiet --only-categories=performance,accessibility,best-practices,seo --form-factor=mobile --screenEmulation.mobile=true --chrome-flags="--headless --no-sandbox" --output=json --output-path=audit-results/lighthouse-es-mobile.json
          ./node_modules/.bin/lighthouse http://localhost:3102/de --quiet --only-categories=performance,accessibility,best-practices,seo --preset=desktop --chrome-flags="--headless --no-sandbox" --output=json --output-path=audit-results/lighthouse-de-desktop.json
      - name: Check external project and profile links
        id: links
        continue-on-error: true
        run: node scripts/audit-external-links.mjs
      - name: Consolidate audit and state outstanding limits
        if: always()
        run: |
          mkdir -p audit-results
          node scripts/audit-report.mjs
          cat audit-results/QA-SUMMARY.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload enterprise evidence (screenshots, logs, audits)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: enterprise-qa-${{ github.run_number }}
          path: |
            audit-results/
            test-results/
          if-no-files-found: warn
          retention-days: 14
      # Lighthouse and the external-link check stay advisory (third-party sites can rate-limit CI); axe and the visual run are required.
      - name: Enforce audit gates
        if: always()
        env:
          AXE_OUTCOME: ${{ steps.axe.outcome }}
          VISUAL_OUTCOME: ${{ steps.visual.outcome }}
        run: |
          status=0
          for gate in "axe:$AXE_OUTCOME" "visual evidence:$VISUAL_OUTCOME"; do
            name="${gate%%:*}"; outcome="${gate##*:}"
            if [ "$outcome" != "success" ]; then
              echo "::error::$name check finished as '$outcome'. Review the enterprise-qa artifact."
              status=1
            fi
          done
          exit $status
